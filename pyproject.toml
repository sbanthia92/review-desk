[project]
name = "reviewdesk"
version = "0.1.0"
description = "Evidence-backed, multi-agent document reviewer exposed as one MCP tool."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.10.0",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "mcp>=2.2.0",
    "openai>=3.22.1",
    "pydantic>=2.13.5",
]

[project.scripts]
reviewdesk = "reviewdesk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reviewdesk"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["eval/results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["reviewdesk", "eval", "scripts", "tests"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live' --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: hits real networks or providers; skipped by default (run with -m live)",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.9",
]
